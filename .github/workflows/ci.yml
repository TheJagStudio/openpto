name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [fee-service, odp-service, ingest-service, gateway]
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: openpto_test, POSTGRES_USER: openpto, POSTGRES_PASSWORD: openpto }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U openpto" --health-interval 5s --health-retries 20
    defaults:
      run: { working-directory: "${{ matrix.service }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable pg_trgm
        run: PGPASSWORD=openpto psql -h localhost -p 5433 -U openpto -d openpto_test -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false

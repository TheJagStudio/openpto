spring:
  application:
    name: odp-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/openpto}
    username: ${DB_USER:openpto}
    password: ${DB_PASSWORD:openpto}
    hikari:
      pool-name: odp-hikari
      data-source-properties:
        reWriteBatchedInserts: true
        ApplicationName: odp-service
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000
      # Native SQL (JDBC writer, exports) resolves odp tables and pg_trgm operators without qualification.
      connection-init-sql: SET search_path TO odp, public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: odp
        jdbc:
          batch_size: 100
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
  flyway:
    schemas: odp
    default-schema: odp
    create-schemas: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
    format:
      date: iso
      date-time: iso
  jackson:
    default-property-inclusion: always
  cache:
    type: caffeine
    cache-names: stats,patentFacets
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s,recordStats
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are validated with the in-process public key (see JwtConfig);
          # other services use http://localhost:8081/.well-known/jwks.json.
          jws-algorithms: RS256

server:
  port: ${PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: odp-service
    description: OpenPTO Open Data Portal (patents, trademarks, accounts)

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
  show-actuator: false

app:
  jwt:
    issuer: openpto
    ttl: 8h
    key-dir: ${JWT_KEY_DIR:../data/keys}
  security:
    internal-token: ${INTERNAL_TOKEN:dev-internal-token-change-me}
    max-failed-logins: 5
    lockout-duration: 15m
  admin:
    enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_EMAIL:admin@openpto.local}
    password: ${ADMIN_PASSWORD:Admin#12345}
    display-name: OpenPTO Admin
  api-keys:
    max-active-per-user: 5
  export:
    max-rows: 10000
  seed:
    enabled: ${SEED_ENABLED:false}
    patents: 5000
    trademarks: 2000
    random-seed: 20250119

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
  level:
    org.hibernate.orm.deprecation: error
